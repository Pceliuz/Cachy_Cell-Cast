# Celiuz Cast (lo copia ./instalar.sh --sistema a /etc/modprobe.d/celiuz-cast.conf)
#
# Dos cámaras virtuales:
#   video10 «Celular» — la que escribe Celiuz Cast y lee OBS.
#   video11 «OBS»     — libre, para el botón «Iniciar cámara virtual» de OBS,
#                       que busca una que nadie esté usando.
# exclusive_caps=1: la cámara solo se anuncia como cámara cuando alguien
# escribe en ella (lo que esperan Chrome, Discord y compañía).
options v4l2loopback devices=2 video_nr=10,11 card_label=Celular,OBS exclusive_caps=1,1
